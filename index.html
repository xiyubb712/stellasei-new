<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="星绥小手机">
  <meta name="theme-color" content="#c9a96e">
  <title>星绥小手机</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- 主样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 手机屏幕（直接全屏显示，电脑端和手机端一致） -->
  <div id="phone-screen">
    
    <!-- 主屏幕 -->
    <div id="desktop">
      <!-- 壁纸层 -->
      <div id="wallpaper"></div>
      
      <!-- 桌面内容层 -->
      <div id="desktop-content">
        <!-- 页面指示器 -->
        <div id="page-indicators"></div>
        
        <!-- 桌面网格容器 -->
        <div id="desktop-container"></div>
      </div>
      
      <!-- 底部Dock栏 -->
      <div id="dock">
        <div class="dock-item" data-app="chat">
          <div class="dock-icon" data-icon="chat"></div>
          <div class="dock-name">聊天</div>
        </div>
        <div class="dock-item" data-app="contacts">
          <div class="dock-icon" data-icon="contacts"></div>
          <div class="dock-name">联系人</div>
        </div>
        <div class="dock-item" data-app="worldbook">
          <div class="dock-icon" data-icon="worldbook"></div>
          <div class="dock-name">世界书</div>
        </div>
        <div class="dock-item" data-app="settings">
          <div class="dock-icon" data-icon="settings"></div>
          <div class="dock-name">设置</div>
        </div>
      </div>
    </div>
    
    <!-- 应用容器（打开应用时显示） -->
    <div id="app-container" class="hidden"></div>
    
    <!-- 导航栏（应用内显示） -->
    <div id="nav-bar" class="hidden">
      <button id="back-button" class="nav-button hidden">
        <span class="nav-icon" data-icon="back"></span>
      </button>
      <div id="nav-title"></div>
      <button id="home-button" class="nav-button">
        <span class="nav-icon" data-icon="home"></span>
      </button>
    </div>
    
  </div>
  
  <!-- 核心模块 -->
  <script src="js/core/storage.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/layout.js"></script>
  
  <!-- 应用模块 -->
  <script src="js/apps/chat.js"></script>
  <script src="js/apps/contacts.js"></script>
  <script src="js/apps/worldbook.js"></script>
  <script src="js/apps/settings.js"></script>
  
  <!-- 入口文件 -->
  <script src="js/main.js"></script>
</body>
</html>
